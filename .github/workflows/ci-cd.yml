name: Salamander Frontend CI/CD

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build frontend Docker image
        run: docker build -t salamander-frontend:latest .

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}

          script: |
            echo "Pulling backend image..."
            docker pull ghcr.io/qopci/salamander:latest

            echo "Stopping existing containers..."
            docker stop salamander-backend || true
            docker stop salamander-frontend || true

            echo "Removing old containers..."
            docker rm salamander-backend || true
            docker rm salamander-frontend || true

            echo "Starting backend..."
            docker run -d --name salamander-backend \
              -p 3000:3000 \
              -v /videos:/videos \
              -v /results:/results \
              ghcr.io/qopci/salamander:latest

            echo "Starting frontend..."
            docker run -d --name salamander-frontend \
              -p 3001:3000 \
              -v /videos:/videos \
              -v /results:/results \
              salamander-frontend:latest
